services:
  hopwatch:
    build: .
    image: hopwatch:latest
    container_name: hopwatch
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - hopwatch-data:/data
    environment:
      # Runs older than the retention setting (default 30 days) are purged hourly.
      HOPWATCH_MAX_CONCURRENT_RUNS: "4"
      HOPWATCH_LOG_LEVEL: "info"
      # Set to "1" to generate synthetic data without sending packets (demos, dev machines).
      HOPWATCH_SIMULATE: "0"
      # Optional: HOPWATCH_MTR_BINARY, HOPWATCH_PORT
    # mtr needs raw sockets for ICMP/UDP/TCP probing.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Optional: uncomment to probe from the host network stack (sees the host's real first hop).
    # network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hopwatch-data:
