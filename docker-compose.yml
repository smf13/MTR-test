services:
  db:
    image: postgres:16-alpine
    container_name: mtr-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mtr
      # Change the password in one place: set MTR_TRACKER_DB_PASSWORD in the shell or in a .env file next to this
      # file (copy .env.example). Both services read it; letters, digits and -_.~ only, since it also goes into the URL.
      # The server takes it only when this volume is first created; change it later with ALTER USER (see the README).
      POSTGRES_PASSWORD: ${MTR_TRACKER_DB_PASSWORD:-mtr}
      POSTGRES_DB: mtr_tracker
    volumes:
      - mtr-tracker-postgres:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP: while the image initialises on its first run, a temporary server answers on the socket only.
      test: ["CMD-SHELL", "pg_isready -h localhost -U mtr -d mtr_tracker"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # The app runs on the host's network stack (below), so it reaches the database through this port on the host's
    # loopback interface only. Set MTR_TRACKER_DB_PORT (shell or .env) when 5432 is taken on the host.
    ports:
      - "127.0.0.1:${MTR_TRACKER_DB_PORT:-5432}:5432"

  mtr-tracker:
    build: .
    image: mtr-tracker:latest
    container_name: mtr-tracker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Host networking: probes leave from the host's own interfaces, so the first hop is the real gateway (not the
    # Docker bridge) and IPv6 targets work whenever the host has IPv6. The web UI listens on the host's port
    # MTR_TRACKER_PORT (default 8899) directly; there is no port mapping. For the Compose bridge network instead,
    # start with docker-compose.bridge.yml on top of this file.
    network_mode: host
    volumes:
      # GeoIP databases and, on an installation upgraded from the SQLite releases, the imported mtr-tracker.db.migrated.
      - mtr-tracker-data:/data
    environment:
      # The bundled server speaks no TLS and the link never leaves this host; a server elsewhere takes ?sslmode=require.
      # The service name "db" does not resolve on host networking, so the database is reached on the loopback port above.
      MTR_TRACKER_DATABASE_URL: postgresql://mtr:${MTR_TRACKER_DB_PASSWORD:-mtr}@127.0.0.1:${MTR_TRACKER_DB_PORT:-5432}/mtr_tracker?sslmode=disable
      # Runs older than the retention setting (default 30 days) are purged hourly.
      MTR_TRACKER_MAX_CONCURRENT_RUNS: "8"
      MTR_TRACKER_LOG_LEVEL: "info"
      # Set to "1" to generate synthetic data without sending packets (demos, dev machines).
      MTR_TRACKER_SIMULATE: "0"
      # Optional: MTR_TRACKER_MTR_BINARY, MTR_TRACKER_PORT, MTR_TRACKER_API_TOKEN, MTR_TRACKER_AUTO_MIGRATE,
      # MTR_TRACKER_DB_POOL_SIZE, MTR_TRACKER_DB_CONNECT_TIMEOUT.
      # Optional: MTR_TRACKER_RUN_AS_ROOT=1 keeps the process as root, only needed for probe intervals below 1 s.
    # The process runs as an unprivileged user; mtr-packet and ping carry the cap_net_raw file capability,
    # which only takes effect when NET_RAW is in the container's capability set (Docker's default includes it).
    cap_add:
      - NET_RAW
    # The image's HEALTHCHECK (curl on /healthz) applies; it reads MTR_TRACKER_PORT inside the container.

volumes:
  mtr-tracker-data:
  mtr-tracker-postgres:
