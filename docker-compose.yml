services:
  mtr-tracker:
    build: .
    image: mtr-tracker:latest
    container_name: mtr-tracker
    restart: unless-stopped
    ports:
      - "8899:8899"
    volumes:
      - mtr-tracker-data:/data
    environment:
      # Runs older than the retention setting (default 30 days) are purged hourly.
      MTR_TRACKER_MAX_CONCURRENT_RUNS: "8"
      MTR_TRACKER_LOG_LEVEL: "info"
      # Set to "1" to generate synthetic data without sending packets (demos, dev machines).
      MTR_TRACKER_SIMULATE: "0"
      # Optional: MTR_TRACKER_MTR_BINARY, MTR_TRACKER_PORT, MTR_TRACKER_API_TOKEN.
      # Optional: MTR_TRACKER_RUN_AS_ROOT=1 keeps the process as root, only needed for probe intervals below 1 s.
    # The process runs as an unprivileged user; mtr-packet and ping carry the cap_net_raw file capability,
    # which only takes effect when NET_RAW is in the container's capability set (Docker's default includes it).
    cap_add:
      - NET_RAW
    # Optional: uncomment to probe from the host network stack (sees the host's real first hop).
    # network_mode: host
    # The image's HEALTHCHECK (curl on /healthz) applies; it reads MTR_TRACKER_PORT inside the container.

volumes:
  mtr-tracker-data:
