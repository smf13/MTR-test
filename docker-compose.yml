services:
  mtr-tracker:
    build: .
    image: mtr-tracker:latest
    container_name: mtr-tracker
    restart: unless-stopped
    ports:
      - "8899:8899"
    volumes:
      - mtr-tracker-data:/data
    environment:
      # Runs older than the retention setting (default 30 days) are purged hourly.
      MTR_TRACKER_MAX_CONCURRENT_RUNS: "4"
      MTR_TRACKER_LOG_LEVEL: "info"
      # Set to "1" to generate synthetic data without sending packets (demos, dev machines).
      MTR_TRACKER_SIMULATE: "0"
      # Optional: MTR_TRACKER_MTR_BINARY, MTR_TRACKER_PORT
    # mtr needs raw sockets for ICMP/UDP/TCP probing.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Optional: uncomment to probe from the host network stack (sees the host's real first hop).
    # network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${MTR_TRACKER_PORT:-8899}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mtr-tracker-data:
